<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Validation Dossier</title>
<!--
  render/template.html — template render cho Validation Dossier.
  Cách dùng: lớp render thay khối `const DOSSIER = {...}` bên dưới bằng Dossier thật
  (cùng schema dossier-schema.md), ghi ra file .html. Template tự đổ dữ liệu ra DOM,
  tự verify lại weighted_totals, và chịu được Dossier khuyết tầng.
  template_version: 1.0.0
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFBFD; --ink:#16181D; --ink-soft:#3C414B; --line:#E2E3E9;
    --rail:#2B3A67;                 /* indigo cấu trúc */
    --rail-soft:#46567F;
    --go:#1F8A4C; --nogo:#C0392B; --pivot:#C77B0A; --park:#5B6B7B;
    --hat-white:#9AA0AC; --hat-red:#C0392B; --hat-black:#16181D;
    --hat-yellow:#C77B0A; --hat-green:#1F8A4C; --hat-blue:#2B3A67;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    --disp:'Space Grotesk',system-ui,sans-serif;
    --body:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);
    line-height:1.55;font-size:16px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px 96px}
  a{color:var(--rail)}
  abbr.term{border-bottom:1px dotted var(--rail-soft);cursor:help;text-decoration:none}
  .pf-verdict{margin-top:12px;padding:12px 14px;border-left:3px solid var(--go);background:rgba(31,138,76,.06);
    font-family:var(--disp);font-size:15px}
  h1,h2,h3{font-family:var(--disp);font-weight:600;letter-spacing:-0.01em;line-height:1.15;margin:0}
  .mono{font-family:var(--mono)}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--rail-soft)}

  /* ---- Verdict band (signature element) ---- */
  .band{border-bottom:1px solid var(--line);margin-bottom:8px}
  .band-inner{max-width:1040px;margin:0 auto;padding:40px 24px 32px;
    display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end}
  .title-block .eyebrow{margin-bottom:14px}
  .title-block h1{font-size:clamp(26px,3.5vw,36px);font-weight:700}
  .title-block .oneliner{color:var(--ink-soft);margin-top:10px;max-width:48ch}
  .makers{margin-top:16px;display:flex;flex-wrap:wrap;gap:6px}
  .maker{font-family:var(--mono);font-size:12px;border:1px solid var(--line);
    border-radius:999px;padding:3px 10px;color:var(--ink-soft)}
  .maker b{color:var(--ink);font-weight:500}

  .verdict-seal{text-align:right;min-width:230px}
  .verdict-word{font-family:var(--disp);font-weight:700;font-size:clamp(34px,6vw,56px);
    line-height:1;letter-spacing:-0.02em}
  .verdict-sub{font-family:var(--mono);font-size:13px;margin-top:8px;color:var(--ink-soft)}
  .v-GO{color:var(--go)} .v-NO_GO{color:var(--nogo)}
  .v-PIVOT{color:var(--pivot)} .v-PARK{color:var(--park)}

  /* confidence gauge */
  .gauge{margin-top:18px}
  .gauge-track{height:8px;border-radius:6px;background:var(--line);overflow:hidden}
  .gauge-fill{height:100%;width:0;border-radius:6px;transition:width 900ms cubic-bezier(.2,.7,.2,1)}
  .gauge-meta{display:flex;justify-content:space-between;font-family:var(--mono);
    font-size:12px;color:var(--ink-soft);margin-top:6px}
  .gauge-meta b{color:var(--ink);font-size:15px;font-weight:700}
  .below{color:var(--nogo)!important}

  /* ---- section scaffold ---- */
  section{padding-top:44px}
  .sec-head{display:flex;align-items:baseline;gap:14px;margin-bottom:18px;
    border-bottom:1px solid var(--line);padding-bottom:10px}
  .sec-num{font-family:var(--mono);font-size:13px;color:var(--rail-soft);font-weight:500}
  .sec-head h3{font-size:17.5px}

  .rationale{display:grid;gap:10px;margin:0;padding:0;list-style:none}
  .rationale li{display:flex;gap:12px;align-items:flex-start;font-size:16px}
  .rationale .n{font-family:var(--mono);color:var(--rail);font-weight:700;flex:none}

  /* 5W1H grid */
  .w-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .w-cell{background:var(--paper);padding:16px 18px}
  .w-cell .k{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--rail-soft);margin-bottom:6px;font-weight:600}
  .problem{margin-top:18px;padding:16px 18px;border-left:3px solid var(--rail);
    background:#F3F5FB;border-radius:0 8px 8px 0}
  .problem .k{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--rail-soft);margin-bottom:4px;font-weight:600}

  /* assumption table */
  table.asm{width:100%;border-collapse:collapse;font-size:14px;margin-top:18px}
  table.asm th,table.asm td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  table.asm thead th{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--rail-soft);font-weight:500}
  table.asm .aid{font-family:var(--mono);color:var(--rail-soft);white-space:nowrap}
  table.asm .lv{font-family:var(--mono);font-size:12px}
  .lv-H{color:var(--nogo)} .lv-M{color:var(--pivot)} .lv-L{color:var(--go)}
  tr.asm-hot{background:#FBE9E7}
  .asm-note{font-size:13.5px;color:var(--ink-soft);margin-top:6px}

  /* question & context block (container tái dùng .problem) */
  .qs .q{font-family:var(--disp);font-size:20px;font-weight:600;line-height:1.35}
  .qs-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
  .mode-chip{font-family:var(--mono);font-size:11px;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .mode-STATELESS{background:#EDEFF6;color:var(--park)}
  .mode-STATEFUL{background:#E6F4EC;color:var(--go)}
  .mode-note{font-size:14px;color:var(--ink-soft)}

  /* routing / pipeline ledger */
  .pipe{display:grid;gap:6px}
  .pipe-row{display:grid;grid-template-columns:30px 1fr auto auto;gap:14px;align-items:center;
    padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .pipe-row .sid{font-family:var(--mono);color:var(--rail-soft);font-size:13px}
  .pipe-row .pname{font-family:var(--disp);font-weight:500}
  .pipe-row .pscore{font-family:var(--mono);font-size:13px;color:var(--ink-soft)}
  .pill{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:3px 9px;border-radius:999px;white-space:nowrap}
  .st-PASSED{background:#E6F4EC;color:var(--go)}
  .st-FAILED{background:#FBE9E7;color:var(--nogo)}
  .st-ASSERTED{background:#EDEFF6;color:var(--rail)}
  .st-REVIEW_NEEDED{background:#FBF1E2;color:var(--pivot)}
  .st-SKIPPED{background:#F1F2F5;color:var(--ink-soft)}
  .st-PENDING{background:#F1F2F5;color:var(--ink-soft)}

  /* gate detail (collapsible) */
  details.gates{margin-top:8px}
  details.gates>summary{cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--rail);
    padding:4px 0;list-style:none}
  details.gates>summary::-webkit-details-marker{display:none}
  details.gates>summary::before{content:'▸ ';color:var(--rail-soft)}
  details.gates[open]>summary::before{content:'▾ '}
  .gate{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;
    padding:10px 0;border-top:1px solid var(--line)}
  .gate .gid{font-family:var(--mono);font-size:12px;color:var(--rail-soft)}
  .gate .gq{font-size:14.5px}
  .gate .gev{font-size:14px;color:var(--ink-soft);margin-top:3px}
  .gate .gv{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:6px;white-space:nowrap}
  .gv-PASS{background:#E6F4EC;color:var(--go)} .gv-FAIL{background:#FBE9E7;color:var(--nogo)}
  .gv-REVIEW{background:#FBF1E2;color:var(--pivot)}
  .ev{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:1px 6px;border-radius:5px;
    margin-left:6px;vertical-align:middle;border:1px solid transparent}
  .ev-MEASURED{background:#E6F4EC;color:var(--go);border-color:#bfe3cd}
  .ev-CITED{background:#EDEFF6;color:var(--rail);border-color:#cfd6ea}
  .ev-USER_STATED{background:#F1F2F5;color:var(--ink-soft);border-color:#e0e1e7}
  .ev-ASSUMED{background:#FBF1E2;color:var(--pivot);border-color:#ecd9b3}
  .ev-UNKNOWN{background:#FBE9E7;color:var(--nogo);border-color:#eccac4}
  .evq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;
    font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
  .evq .lbl{letter-spacing:.1em;text-transform:uppercase;color:var(--rail-soft)}
  .evq .warn{color:var(--nogo)}

  /* critique block — dark, prominent */
  .critique{background:var(--ink);color:#E9EAEE;border-radius:14px;padding:28px 30px;margin-top:6px}
  .critique h3{color:#fff;font-size:20px}
  .critique .sub{color:#9AA0AC;font-family:var(--mono);font-size:12px;letter-spacing:.08em;
    text-transform:uppercase;margin-top:4px}
  .crit-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:22px}
  .crit-col h3{font-size:14px;color:#fff;font-family:var(--mono);letter-spacing:.06em;
    text-transform:uppercase;margin-bottom:10px;font-weight:500}
  .crit-col h3 .dot{display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--nogo);margin-right:7px;vertical-align:middle}
  .pm{border-left:2px solid #3a3d46;padding:2px 0 2px 14px;margin-bottom:14px}
  .pm .fm{font-weight:600;color:#fff}
  .pm .cz{color:#B8BDC9;font-size:14px;margin-top:2px}
  .pm .mt{color:#8FCBAA;font-size:14px;margin-top:4px}
  .crit-list{margin:0;padding-left:18px;color:#D3D7DF}
  .crit-list li{margin-bottom:8px;font-size:15px}

  /* six hats */
  .hats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:4px}
  .hat{border:1px solid var(--line);border-radius:10px;padding:16px;background:#fff;
    border-top:3px solid var(--ink)}
  .hat .hl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    margin-bottom:8px;font-weight:500}
  .hat p{margin:0;font-size:14px;color:var(--ink-soft)}
  .hat-white{border-top-color:var(--hat-white)} .hat-white .hl{color:var(--hat-white)}
  .hat-red{border-top-color:var(--hat-red)} .hat-red .hl{color:var(--hat-red)}
  .hat-black{border-top-color:var(--hat-black)} .hat-black .hl{color:var(--hat-black)}
  .hat-yellow{border-top-color:var(--hat-yellow)} .hat-yellow .hl{color:var(--hat-yellow)}
  .hat-green{border-top-color:var(--hat-green)} .hat-green .hl{color:var(--hat-green)}
  .hat-blue{border-top-color:var(--hat-blue)} .hat-blue .hl{color:var(--hat-blue)}

  /* SWOT 2x2 */
  .swot-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .swot{border:1px solid var(--line);border-radius:10px;padding:16px;background:#fff;border-top:3px solid var(--ink)}
  .swot .hl{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;font-weight:600}
  .swot ul{margin:0;padding-left:18px}
  .swot li{margin-bottom:5px;font-size:14px;color:var(--ink-soft)}
  .swot-S{border-top-color:var(--go)} .swot-S .hl{color:var(--go)}
  .swot-W{border-top-color:var(--nogo)} .swot-W .hl{color:var(--nogo)}
  .swot-O{border-top-color:var(--rail)} .swot-O .hl{color:var(--rail)}
  .swot-T{border-top-color:var(--pivot)} .swot-T .hl{color:var(--pivot)}

  /* Porter five forces */
  .forces{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .force{border:1px solid var(--line);border-radius:10px;padding:15px 16px;background:#fff}
  .force .fh{margin-bottom:6px}
  .force .fn{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--rail);font-weight:600}
  .force p{margin:0;font-size:14px;color:var(--ink-soft)}

  /* decision matrix */
  table.matrix{width:100%;border-collapse:collapse;font-size:14px;margin-top:4px}
  table.matrix th,table.matrix td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--line)}
  table.matrix th:first-child,table.matrix td:first-child{text-align:left;font-weight:500}
  table.matrix thead th{font-family:var(--mono);font-size:11px;letter-spacing:.04em;
    text-transform:uppercase;color:var(--rail-soft);font-weight:500}
  table.matrix .wt{font-family:var(--mono);font-size:11px;color:var(--rail-soft);display:block}
  table.matrix td.val{font-family:var(--mono);color:var(--ink-soft)}
  table.matrix tr.winner{background:#F3F5FB}
  table.matrix td.total{font-family:var(--mono);font-weight:700;color:var(--ink)}
  .verify{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;
    margin-top:10px;color:var(--go)}
  .verify.bad{color:var(--nogo)}

  /* party mode */
  .party{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .pcard{border:1px solid var(--line);border-radius:10px;padding:15px 16px;background:#fff;
    border-left:3px solid var(--rail-soft)}
  .pcard.lean-GO{border-left-color:var(--go)} .pcard.lean-NO_GO{border-left-color:var(--nogo)}
  .pcard.lean-PIVOT{border-left-color:var(--pivot)} .pcard.lean-PARK{border-left-color:var(--park)}
  .pcard .ph{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}
  .pcard .pn{font-family:var(--disp);font-weight:600;font-size:15px}
  .pcard .prole{font-family:var(--mono);font-size:11px;color:var(--rail-soft);text-transform:uppercase;letter-spacing:.06em}
  .pcard .plean{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:5px;white-space:nowrap}
  .plean.lean-GO{background:#E6F4EC;color:var(--go)} .plean.lean-NO_GO{background:#FBE9E7;color:var(--nogo)}
  .plean.lean-PIVOT{background:#FBF1E2;color:var(--pivot)} .plean.lean-PARK{background:#EDEFF6;color:var(--park)}
  .pcard .parg{font-size:14px;color:var(--ink-soft)}
  .pcard .pcon{font-size:13.5px;color:var(--nogo);margin-top:6px}
  .clashes{margin-top:16px;border:1px dashed var(--rail-soft);border-radius:10px;padding:14px 16px;background:#F8F9FC}
  .clashes .ct{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--rail);margin-bottom:8px}
  .clash{font-size:14px;margin-bottom:6px}
  .clash b{font-family:var(--disp)}
  .psyn{margin-top:14px;padding-left:14px;border-left:3px solid var(--rail);font-size:14.5px}

  /* coaching — warm advisor block */
  .coach{background:linear-gradient(180deg,#F3F5FB 0%,#FBFBFD 100%);border:1px solid #d8deef;
    border-radius:14px;padding:28px 30px}
  .coach .ch{font-family:var(--disp);font-weight:600;font-size:20px;margin-bottom:6px}
  .coach .stance{font-size:16px;color:var(--ink);border-left:3px solid var(--rail);padding-left:14px;margin:14px 0 22px}
  .moves{display:grid;gap:12px;margin:0;padding:0;list-style:none}
  .move{display:flex;gap:13px;align-items:flex-start}
  .move .mi{font-family:var(--mono);font-weight:700;color:var(--rail);flex:none;font-size:15px}
  .move .ma{font-weight:600}
  .move .mw{color:var(--ink-soft);font-size:14px}
  .move .mt{font-family:var(--mono);font-size:11px;color:var(--rail-soft);margin-left:6px}
  .coach-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px}
  .coach-grid .ck{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--rail-soft);margin-bottom:7px;font-weight:600}
  .watch{padding:12px 14px;background:#FBE9E7;border-radius:8px;font-size:14px;color:var(--ink)}
  .gaps{margin:0;padding-left:18px} .gaps li{margin-bottom:4px;font-size:14px}
  .advisor{margin-top:22px;padding:18px 20px;background:#16181D;color:#E9EAEE;border-radius:10px;font-size:15px;line-height:1.6}
  .advisor .al{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8FCBAA;margin-bottom:8px}

  /* journal */
  .journal{border:1px solid var(--line);border-radius:12px;padding:22px 24px;background:#fff}
  .journal .meta{font-family:var(--mono);font-size:13px;color:var(--ink-soft);margin-bottom:14px}
  .jrow{margin-bottom:14px}
  .jrow .jk{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--rail-soft);margin-bottom:5px;font-weight:600}
  .jrow ul{margin:0;padding-left:18px}
  .jrow li{margin-bottom:4px}
  .tag-type{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:6px;
    background:#EDEFF6;color:var(--rail)}

  /* gtm / lifecycle generic */
  .kv{display:grid;gap:20px}
  .kv>.row:not(:last-child){padding-bottom:18px;border-bottom:1px dashed var(--line)}
  .kv .row .k{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--rail-soft);margin-bottom:4px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);border-radius:7px;padding:5px 12px;font-size:14px;background:#F6F7FA}
  .steps{margin:0;padding-left:18px}
  .steps li{margin-bottom:4px;font-size:14px}

  /* ===== chapters + navigation ===== */
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  .skip-link{position:absolute;left:-9999px;top:0;background:var(--rail);color:#fff;
    padding:8px 14px;border-radius:0 0 8px 0;z-index:100}
  .skip-link:focus{left:0}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:40px;align-items:start}
  .toc{display:none}
  @media (min-width:1024px){
    .toc{display:block;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;
      font-size:13px;padding:8px 0}
    .toc a{display:block;padding:4px 10px;color:var(--ink-soft);text-decoration:none;
      border-left:2px solid var(--line)}
    .toc a.toc-ch{font-family:var(--disp);font-weight:600;color:var(--ink);margin-top:10px}
    .toc a.toc-sub{padding-left:24px;font-size:12.5px}
    .toc a:hover{color:var(--rail)}
    .toc a.active{border-left-color:var(--rail);color:var(--rail);background:#F3F5FB}
  }
  @media (max-width:1023px){.layout{grid-template-columns:1fr}}
  .ch-pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
  @media (min-width:1024px){.ch-pills{display:none}}
  .ch-pills a{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:999px;
    padding:4px 12px;color:var(--ink-soft);text-decoration:none;background:#fff}
  .ch-pills a:hover{border-color:var(--rail);color:var(--rail)}
  .chapter{padding-top:48px}
  .ch-head{display:flex;gap:16px;align-items:flex-start;border-bottom:2px solid var(--ink);
    padding-bottom:14px;margin-bottom:6px}
  .ch-num{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--rail);line-height:1.1}
  .ch-t h2{font-size:23px}
  .ch-q{margin:4px 0 0;color:var(--ink-soft);font-size:14.5px}
  .chapter section{padding-top:30px}
  .gauge-note{font-size:12.5px;color:var(--ink-soft);margin-top:8px}
  .ev-legend{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;
    color:var(--ink-soft);margin-bottom:16px}
  .ev-legend .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;

// bộ fallback chỉ lấp thuật ngữ thiếu khi mở file trực tiếp không kèm Dossier thật.
const TERMS=Object.assign({},FALLBACK_TERMS,DOSSIER.render?.glossary||{});
function glossify(root){
  const keys=Object.keys(TERMS).sort((a,b)=>b.length-a.length);
  const rx=new RegExp("\\b("+keys.map(k=>k.replace(/[.*+?^${}()|[\\]\\\\]/g,"\\$&")).join("|")+")\\b","g");
  const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  const targets=[]; let n;
  while(n=walker.nextNode()){
    if(n.parentNode&&n.parentNode.closest&&n.parentNode.closest("abbr.term")) continue;
    rx.lastIndex=0; if(rx.test(n.nodeValue)) targets.push(n);
  }
  targets.forEach(t=>{
    const frag=document.createDocumentFragment(); let last=0,m; rx.lastIndex=0;
    while(m=rx.exec(t.nodeValue)){
      if(m.index>last) frag.appendChild(document.createTextNode(t.nodeValue.slice(last,m.index)));
      const ab=document.createElement("abbr"); ab.className="term"; ab.title=TERMS[m[0]]; ab.textContent=m[0];
      frag.appendChild(ab); last=m.index+m[0].length;
    }
    if(last<t.nodeValue.length) frag.appendChild(document.createTextNode(t.nodeValue.slice(last)));
    t.parentNode.replaceChild(frag,t);
  });
}
const HAT_ORDER=[["white","Mũ trắng · Dữ liệu"],["red","Mũ đỏ · Trực giác"],["black","Mũ đen · Rủi ro"],

// Tái tạo công thức confidence của dossier-schema.md §4.6 — renderer tự đối chiếu.
function computeConfidence(d){
  const ok=new Set(["PASSED","ASSERTED","REVIEW_NEEDED"]);
  const vals=(d.stages||[]).filter(s=>s.stage_id<=5&&ok.has(s.status))
    .map(s=>(s.status==="REVIEW_NEEDED"?0.85:1)*(s.score||0));
  if(!vals.length) return null;
  const m=vals.reduce((a,b)=>a+b,0)/vals.length;
  return Math.min(1,Math.max(0,Math.round(m*1000)/1000));
}

  document.getElementById("verdict-sub").textContent=MEANS_LABEL[v]||v;
  // gauge
  const c=dec.confidence, thr=dec.confidence_threshold??(dec.decision_type==="TYPE_1"?0.75:0.65);
  document.getElementById("gval").textContent=c==null?"—":fmt(c);
  document.getElementById("gthr").textContent="/ ngưỡng "+fmt(thr);

  requestAnimationFrame(()=>{fill.style.width=((c==null?0:c)*100).toFixed(0)+"%";});

  const oldCv=document.getElementById("confverify"); if(oldCv) oldCv.remove();
  const cc=computeConfidence(d);

    const okc=Math.abs(c-cc)<=0.005;

    badge.className="verify"+(okc?"":" bad"); badge.id="confverify";
    badge.textContent=(okc?"✓ Confidence khớp":"⚠ Confidence LỆCH")+" với số hệ thống tự tính lại ("+fmt(cc)+")";
    document.querySelector(".gauge").appendChild(badge);
  }
  const oldGn=document.getElementById("gauge-note"); if(oldGn) oldGn.remove();
  if(c!=null){
    const gn=document.createElement("div");
    gn.className="gauge-note"; gn.id="gauge-note";
    gn.textContent=below?"Chưa đủ tự tin để tiến hành sạch — verdict bị hạ thành xem lại":"Đủ tự tin so với ngưỡng cần đạt";
    document.querySelector(".gauge").appendChild(gn);

  const mk=document.getElementById("makers");

function buildNav(){
  const toc=document.getElementById("toc"), pills=document.getElementById("ch-pills");
  let th="",ph="";
  const chapters=document.querySelectorAll("#main .chapter");
  chapters.forEach(ch=>{
    const num=ch.querySelector(".ch-num").textContent, title=ch.querySelector(".ch-t h2").textContent;
    th+=`<a class="toc-ch" href="#${ch.id}"><b>${num}</b> · ${esc(title)}</a>`;
    ph+=`<a href="#${ch.id}">${num} · ${esc(title)}</a>`;
    ch.querySelectorAll("[data-toc], .sec-head").forEach(el=>{

        th+=`<a class="toc-sub" href="#${el.id}">${esc(el.dataset.toc)}</a>`;

      links.forEach(a=>a.classList.toggle("active",a.getAttribute("href")==="#"+e.target.id));
    });
  },{rootMargin:"-15% 0px -75% 0px"});
  chapters.forEach(ch=>obs.observe(ch));
}

function renderPipeline(d){
  const stages=(d.stages||[]).slice().sort((a,b)=>a.stage_id-b.stage_id);
  if(!stages.length) return "";

  const counts={MEASURED:0,CITED:0,USER_STATED:0,ASSUMED:0,UNKNOWN:0};
  stages.forEach(s=>(s.gates||[]).forEach(g=>{if(g.evidence_type&&counts[g.evidence_type]!=null)counts[g.evidence_type]++;}));
  const total=Object.values(counts).reduce((a,b)=>a+b,0);
  let evq="";
  if(total){
    const soft=counts.ASSUMED+counts.UNKNOWN, hard=counts.MEASURED+counts.CITED;
    const parts=Object.entries(counts).filter(([,n])=>n>0)
      .map(([k,n])=>`<span class="ev ev-${k}">${EV_LABEL[k]} ${n}</span>`).join("");

    ["ASSUMED","chưa kiểm chứng"],["UNKNOWN","không có cơ sở"]];

        <span class="gv gv-${g.verdict}">${GVERDICT_LABEL[g.verdict]||esc(g.verdict)} ${g.score!=null?fmt(g.score):""}</span>

function renderMatrix(d){
  const mx=d.lenses?.decision_matrix; if(!mx) return "";
  const crit=mx.criteria||[]; const opts=mx.options||[]; const sc=mx.scores||{}; const wt=mx.weighted_totals||{};
  // verify: recompute
  let maxOpt=null,maxVal=-1,mismatch=false;
  const recomputed={};
  opts.forEach(o=>{
    let sum=0; crit.forEach(c=>{ sum+=(sc[o]?.[c.name]||0)*(c.weight||0); });
    sum=Math.round(sum*1000)/1000; recomputed[o]=sum;
    if(wt[o]!=null && Math.abs(wt[o]-sum)>0.005) mismatch=true;
    if(sum>maxVal){maxVal=sum;maxOpt=o;}
  });
  const head=`<tr><th>Phương án</th>${crit.map(c=>`<th>${esc(c.name)}<span class="wt">trọng số ${fmt(c.weight)}</span></th>`).join("")}<th>Tổng</th></tr>`;
  const body=opts.map(o=>{
    const cells=crit.map(c=>`<td class="val">${fmt(sc[o]?.[c.name])}</td>`).join("");
    const tot=wt[o]!=null?wt[o]:recomputed[o];
    return `<tr class="${o===maxOpt?"winner":""}"><td>${esc(o)}${o===maxOpt?" ★":""}</td>${cells}<td class="total">${fmt(tot)}</td></tr>`;
  }).join("");
  const verify=mismatch
    ? `<div class="verify bad">⚠ Tổng điểm lệch với số hệ thống tự tính — cần kiểm tra lại</div>`
    : `<div class="verify">✓ Tổng điểm khớp với số hệ thống tự tính lại</div>`;
  return sec("3.6","Bảng so sánh phương án",
    `<table class="matrix"><thead>${head}</thead><tbody>${body}</tbody></table>${verify}`);
}

    ${row("Lời mỗi khách (sau chi phí)",p.unit_margin)}
    ${row("Bao lâu thu hồi vốn",p.payback_period)}
    ${row("Có lời khi còn nhỏ?",p.profitable_at_small_scale)}
    ${p.watch?`<div class="row"><div class="k">Cần canh</div><div class="watch">${esc(p.watch)}</div></div>`:""}
  </div>${p.verdict?`<div class="pf-verdict">${esc(p.verdict)}</div>`:""}`;
  return sec("3.7","Tính chuyện có lời",inner);
}

function renderJournal(d){
  const dec=d.decision; if(!dec) return "";
  const j=dec.journal||{};
  const list=(arr)=>arr&&arr.length?`<ul>${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"<p>—</p>";
  const inner=`<div class="journal">
    <div class="meta">Quyết định bởi <b>${esc(j.decided_by||"—")}</b> · ${esc((j.decided_at||"").slice(0,10))}
      · <span class="tag-type">${TYPE_LABEL[dec.decision_type]||esc(dec.decision_type||"")}</span></div>
    <div class="jrow"><div class="jk">Giả định nền</div>${list(j.key_assumptions)}</div>
    <div class="jrow"><div class="jk">Điều kiện cần xem lại quyết định</div>${list(j.reversal_conditions)}</div>
  </div>`;
  return sec("4.2","Nhật ký quyết định",inner);
}

function renderPlan(d){
  const g=d.gtm_plan; const lc=d.lifecycle; // render khi có dữ liệu — không chặn theo verdict (plan-mode: sản phẩm đang sống = GO sẵn)
  if(!g&&!lc) return "";
  const chips=arr=>`<div class="chips">${(arr||[]).map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`;
  const steps=arr=>`<ul class="steps">${(arr||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`;
  const kv=rows=>rows?`<div class="kv">${rows}</div>`:"";
  // 1 · Ra mắt như thế nào
  let launch="";
  if(g){
    if(g.positioning) launch+=`<div class="row"><div class="k">Định vị</div><div>${esc(g.positioning)}</div></div>`;
    if(g.beachhead) launch+=`<div class="row"><div class="k">Nhóm khách đầu cầu</div><div>${esc(g.beachhead)}</div></div>`;
    if(g.messaging) launch+=`<div class="row"><div class="k">Thông điệp chính</div>${steps(g.messaging)}</div>`;
    if(g.channels) launch+=`<div class="row"><div class="k">Kênh</div>${chips(g.channels)}</div>`;
    if(g.launch_steps) launch+=`<div class="row"><div class="k">Bước launch</div><ol class="stepper">${g.launch_steps.map(x=>`<li><span class="n"></span><span>${esc(x)}</span></li>`).join("")}</ol></div>`;
  }
  // 2 · Đo cái gì
  let measure="";
  if(g){
    if(g.north_star_metric) measure+=`<div class="ns-card"><div class="nk">Chỉ số quan trọng nhất (North Star)</div><div class="nv">${esc(g.north_star_metric)}</div></div>`;
    if(g.aarrr&&Object.keys(g.aarrr).length){
      const st=Object.entries(g.aarrr).map(([k,v])=>`<div class="funnel-step"><div class="fl">${AARRR_LABEL[k]||esc(k)}</div><p>${esc(v)}</p></div>`).join("");
      measure+=`<div class="row"><div class="k">Khung đo AARRR — 5 bước khách đi qua</div><div class="funnel">${st}</div></div>`;
    }
    if(g.okrs) measure+=g.okrs.map(o=>`<div class="row"><div class="k">Mục tiêu: ${esc(o.objective)}</div>${steps(o.key_results)}</div>`).join("");
  }
  if(lc){
    if(lc.funnel_metrics) measure+=`<div class="row"><div class="k">Chỉ số phễu cần đo</div>${chips(lc.funnel_metrics)}</div>`;
    if(lc.cohort_retention) measure+=`<div class="row"><div class="k">Giữ khách theo cohort</div><div>${esc(lc.cohort_retention)}</div></div>`;
  }
  // 3 · Rồi sao nữa
  let later="";
  if(lc&&(lc.expand_criteria||lc.sunset_criteria)){
    const ok=lc.expand_criteria?`<div class="branch branch-ok"><div class="bh">Nếu đạt → Mở rộng</div><ul>${lc.expand_criteria.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
    const stop=lc.sunset_criteria?`<div class="branch branch-stop"><div class="bh">Nếu không đạt → Thu hẹp</div><ul>${lc.sunset_criteria.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:"";
    later+=`<div class="branches">${ok}${stop}</div>`;
  }
  if(lc&&lc.revalidation) later+=`<div class="loop">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
    <span><b>Xem lại định kỳ:</b> ${esc(lc.revalidation.trigger)} → chạy lại tầng ${(lc.revalidation.stages_to_recheck||[]).join(", ")}</span></div>`;
  let inner="";
  if(launch) inner+=`<div class="pv-sub">Ra mắt như thế nào</div>${kv(launch)}`;
  if(measure) inner+=`<div class="pv-sub">Đo cái gì</div>${kv(measure)}`;
  if(later) inner+=`<div class="pv-sub">Rồi sao nữa</div>${later}`;
  return sec("4.1","Kế hoạch & vòng đời",inner);
}

function render(d){
  if((d.meta?.schema_version||"").split(".")[0]!=="1"){
    document.getElementById("main").innerHTML=
      `<section><p>⚠ schema_version ${esc(d.meta?.schema_version)} không tương thích template 1.x.</p></section>`;
    return;
  }
  renderHeader(d);
  SEC_N=0;
  const ch1=[renderContext(d),renderExec(d),renderCoaching(d)].join("");
  const ch2=[renderPipeline(d),renderFraming(d)].join("");
  const ch3=[renderCritique(d),renderHats(d),renderSwot(d),renderPorter(d),renderParty(d),renderMatrix(d),renderProfitFirst(d)].join("");
  const ch4=[renderPlan(d),renderJournal(d)].join("");
  let html="";
  if(ch1) html+=chapter(1,ch1);
  if(ch2) html+=chapter(2,ch2);
  if(ch3) html+=chapter(3,ch3);
  if(ch4) html+=chapter(4,ch4);
  document.getElementById("main").innerHTML=html+
  `<footer><span>dossier ${esc(d.meta?.dossier_id||"")} · schema ${esc(d.meta?.schema_version||"")}</span>
    <span>render ${esc((d.render?.rendered_at||"").slice(0,16).replace("T"," "))} · template ${esc(d.render?.template_version||"1.0.0")}</span></footer>`;
  buildNav();
}
render(DOSSIER);
glossify(document.getElementById("main"));
</script>
</body>
</html>
